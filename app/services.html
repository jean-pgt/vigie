<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><!-- certains services (OPNsense) refusent les visites venant d'un autre site -->
<title>Services · __TITRE__</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__TITRE__">
<link rel="icon" href="/s/icone.svg">
<link rel="apple-touch-icon" href="/s/icone-180.png">
<link rel="manifest" href="/s/manifest.webmanifest">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; color: #fff; font: 14px/1.45 "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.page { max-width: 1440px; margin: 0 auto; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
.k { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--off); display: inline-block; }
.dot.ok { background: var(--on); box-shadow: 0 0 8px rgba(167,243,208,.6); }
.dot.ko { background: var(--ko); box-shadow: 0 0 8px rgba(252,165,165,.7); }
.dot.attente { background: var(--new); }

.accueil { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; padding: 26px 4px 18px; }
.accueil h1 { margin: 0; font-size: clamp(32px, 5vw, 46px); font-weight: 650; letter-spacing: -.035em; text-shadow: 0 2px 24px rgba(0,0,0,.3); }
.accueil p { margin: 4px 0 0; color: rgba(255,255,255,.82); font-size: 15px; }
.etat-global { display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 999px; font-size: 13px; }
.etat-global .dot { animation: pulse 2.4s infinite; }
.recherche-s { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; min-width: 260px; color: var(--muted); }
.recherche-s input { background: none; border: 0; outline: 0; color: #fff; font: inherit; width: 100%; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 14px; }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kpi b { font-size: 28px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi b small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.kpi span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .att { color: var(--new); }

.noeuds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 26px; }
.noeud { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.noeud .tete { display: flex; align-items: center; gap: 10px; }
.noeud .tete b { font-size: 15.5px; font-weight: 600; }
.noeud .tete small { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.jauge-n { display: flex; flex-direction: column; gap: 7px; }
.jauge-n div:first-child { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.jauge-n div:first-child span:last-child { color: #fff; font-family: var(--mono); }
.piste { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.piste i { display: block; height: 100%; border-radius: 3px; background: rgba(255,255,255,.88); transition: width .8s var(--ease); }
.piste i.haut { background: var(--new); }
.noeud .pied { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.noeud .vide { font-size: 12.5px; color: var(--faint); }

.corps { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.groupe { margin-bottom: 26px; }
.groupe h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 12px; font-size: 16px; font-weight: 600; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
.groupe h2 span { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.tuiles-s { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.tuile { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; min-height: 64px;
  background: rgba(22,24,30,.32); -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.tuile:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); }
.tuile .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; border: 1px solid rgba(255,255,255,.22);
  background: linear-gradient(150deg, rgba(255,255,255,.2), rgba(255,255,255,.05)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.tuile .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.tuile .tx b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tuile .tx small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tuile.ko { border-color: rgba(252,165,165,.45); }
.tuile.ko .tx small { color: var(--ko); }

.cote { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
.bloc { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.bloc .titre { display: flex; justify-content: space-between; align-items: center; }
.bloc .titre a { font-size: 12.5px; color: var(--muted); }
.bloc .titre a:hover { color: #fff; }
.alerte { display: flex; gap: 11px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); }
.alerte .dot { margin-top: 6px; }
.alerte div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.alerte b { font-weight: 550; font-size: 13.5px; }
.alerte small { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.calme { font-size: 13px; color: var(--muted); display: flex; gap: 9px; align-items: center; }
.lecture { display: flex; gap: 12px; align-items: center; }
.lecture .af { width: 42px; height: 60px; border-radius: 8px; flex: none; background: linear-gradient(160deg, rgba(255,255,255,.3), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; }
.lecture div:last-child { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lecture b { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lecture small { font-size: 12px; color: var(--muted); }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.duo div { padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,.07); }
.duo small { display: block; font-size: 11.5px; color: var(--muted); }
.duo b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ligne-kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.ligne-kv span:first-child { color: var(--muted); }
.aucun { padding: 40px 0; text-align: center; color: var(--muted); }

@media (max-width: 1280px) { .noeuds { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1080px) { .corps { grid-template-columns: 1fr; } .cote { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
@media (max-width: 760px) {
  .accueil { padding: 14px 2px 12px; }
  .recherche-s { flex-basis: 100%; min-width: 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpis .kpi:first-child { grid-column: 1 / -1; }
  .kpi { padding: 14px 16px; } .kpi b { font-size: 23px; }
  .noeuds { grid-template-columns: 1fr; gap: 10px; }
  .tuiles-s { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tuile { flex-direction: column; align-items: flex-start; gap: 10px; min-height: 0; }
  .tuile .dot { position: absolute; top: 14px; right: 14px; }
  .cote { grid-template-columns: 1fr; }
}
</style>
<link rel="stylesheet" href="/s/theme.css">
</head>
<body>
<div class="page">
  <div id="barre" data-menu="services"></div>
  <script src="/s/barre.js"></script>

  <div class="accueil">
    <div><h1 id="salut">Bonsoir</h1><p id="resume">Chargement…</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <label class="recherche-s verre"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Chercher une appli…  /" aria-label="Chercher une appli" autocomplete="off"></label>
      <div class="etat-global verre" id="etat-global"><span class="dot"></span><span>…</span></div>
    </div>
  </div>

  <section class="kpis" id="kpis"></section>
  <section class="noeuds" id="noeuds"></section>

  <div class="corps">
    <main id="groupes"></main>
    <aside class="cote" id="cote"></aside>
  </div>
</div>
<script>
const A = window.vigie, $ = (id) => document.getElementById(id), e = A.echapper;
let donnees = null;

function salut() {
  const h = new Date().getHours();
  $("salut").textContent = h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir";
}

function kpis(d) {
  const k = d.kpis, i = k.internet, nas = k.nas, dns = k.dns;
  const cartes = [
    ["Services", `${k.services.ok} / ${k.services.total}`, "", k.services.ok === k.services.total ? "Tout répond" : `${k.services.total - k.services.ok} en panne`, k.services.ok !== k.services.total],
    ["Internet", i ? A.nb(i.down / 1e6) : "—", "↓ Mb/s", i ? `${A.nb(i.up / 1e6)} ↑ · ${A.nb(i.ping, 0)} ms · ${A.il_y_a(i.ts)}` : "pas encore mesuré"],
    k.proxmox.total && ["Proxmox", `${k.proxmox.noeuds} / ${k.proxmox.total}`, "nœuds", k.proxmox.vm_on != null ? `${k.proxmox.vm_on} / ${k.proxmox.vm} VM et CT allumés` : `${k.proxmox.vm} VM et CT`],
    nas ? ["NAS", `${A.nb(Math.max(nas.disque || 0, ...Object.values(nas.volumes || {})))} %`, "rempli", `processeur ${A.nb(nas.cpu)} % · ${A.nb(nas.temp)} °C`]
        : ["DNS", dns ? A.nb(dns.requetes) : "—", "requêtes", dns ? `${A.nb(100 * dns.bloquees / (dns.requetes || 1), 1)} % bloquées` : ""],
    ["Alertes", d.n_alertes, d.n_alertes ? "à regarder" : "", d.alertes.length ? d.alertes[0].titre : "Rien à signaler", d.n_alertes > 0],
  ].filter(Boolean);
  $("kpis").innerHTML = cartes.map(([l, v, u, n, att]) => `<a class="kpi verre apparait" href="${l === "Alertes" ? "/metriques#global" : l === "Proxmox" ? "/metriques#proxmox" : l === "Internet" ? "/metriques#opnsense" : "#"}">
    <span class="lbl">${l}</span><b>${e(v)}<small>${e(u)}</small></b><span class="${att ? "att" : ""}">${e(n)}</span></a>`).join("");
}

function noeuds(d) {
  $("noeuds").innerHTML = d.noeuds.map((n) => {
    const j = (nom, v) => `<div class="jauge-n"><div><span>${nom}</span><span>${v == null ? "—" : A.nb(v) + " %"}</span></div><div class="piste"><i class="${v > 85 ? "haut" : ""}" style="width:${v || 0}%"></i></div></div>`;
    const detail = n.cpu == null ? `<div class="vide">Processeur, mémoire et disque : relevé à brancher (Beszel)</div>`
      : `<div class="jauges">${j("CPU", n.cpu)}${j("RAM", n.mem)}${j("Disque", n.disque)}</div>`;
    return `<div class="noeud verre apparait"><div class="tete"><span class="dot ${n.etat}"></span><b>${e(n.nom)}</b><small>${e(n.modele || (n.coeurs ? n.coeurs + " cœurs" : ""))}</small></div>
      ${detail}<div class="pied"><span>${n.vm != null ? n.vm + " VM et CT" : n.conteneurs ? n.conteneurs + " conteneurs" : "stockage"}</span>
      <span>${n.temp != null ? A.nb(n.temp) + " °C" : ""}</span><span>${n.uptime ? "depuis " + A.duree(n.uptime) : ""}</span></div></div>`;
  }).join("");
}

function groupes(d) {
  const q = $("q").value.trim().toLowerCase();
  const html = d.groupes.map((g) => {
    const apps = g.apps.filter((a) => !q || (a.nom + " " + g.nom).toLowerCase().includes(q));
    if (!apps.length) return "";
    return `<section class="groupe"><h2>${e(g.nom)}<span>${g.suivies ? `${g.en_ligne} / ${g.suivies} en ligne` : ""}</span></h2><div class="tuiles-s">${apps.map((a) =>
      `<a class="tuile incline lueur apparait ${a.etat === "ko" ? "ko" : ""}" href="${e(a.url)}" target="_blank" rel="noopener">
        <span class="ic">${A.icone(a.icone)}</span><span class="tx"><b>${e(a.nom)}</b><small>${e(a.stat)}</small></span><span class="dot ${a.etat}"></span></a>`).join("")}</div></section>`;
  }).join("");
  $("groupes").innerHTML = html || `<div class="aucun">Aucune appli ne correspond à « ${e(q)} ».</div>`;
}

function cote(d) {
  const niv = { critique: "ko", attention: "attente", info: "" };
  const alertes = d.alertes.length ? d.alertes.map((a) => `<div class="alerte"><span class="dot ${niv[a.niveau]}"></span><div><b>${e(a.titre)}</b><small>${e(a.detail)} · ${e(a.source)}</small></div></div>`).join("")
    : `<div class="calme"><span class="dot ok"></span>Rien à signaler.</div>`;
  let html = `<div class="bloc verre apparait"><div class="titre"><span class="lbl">À regarder</span><a href="/metriques#global">Tout voir →</a></div>${alertes}</div>`;
  if (d.lectures) {
    html += `<div class="bloc verre apparait"><div class="titre"><span class="lbl">En lecture</span><span class="lbl">Plex et Jellyfin</span></div>${d.lectures.length ? d.lectures.map((l) =>
      `<div class="lecture"><div class="af">${A.icone(l.source || "jellyfin", 18)}</div><div><b>${e(l.titre)}</b><small>${e(l.qui)} · ${e(l.appareil)}${l.transcodage ? " · transcodage" : ""}${l.pause ? " · en pause" : ""}</small>
        ${l.pct != null ? `<div class="piste"><i style="width:${l.pct}%"></i></div>` : ""}</div></div>`).join("") : `<div class="calme">Rien en lecture.</div>`}</div>`;
  }
  const i = d.kpis.internet;
  if (i) html += `<div class="bloc verre apparait"><div class="titre"><span class="lbl">Internet</span><a href="/appareils">Détail →</a></div>
    <div class="duo"><div><small>Réception</small><b>${A.nb(i.down / 1e6)}</b> <small style="display:inline">Mb/s</small></div><div><small>Envoi</small><b>${A.nb(i.up / 1e6)}</b> <small style="display:inline">Mb/s</small></div></div>
    <div class="ligne-kv"><span>Ping</span><span>${A.nb(i.ping, 0)} ms · ${e(i.serveur)}</span></div><div class="ligne-kv"><span>Mesuré</span><span>${A.il_y_a(i.ts)}</span></div></div>`;
  if (d.pbs) {
    const p = d.pbs, dernier = Math.max(...p.groupes.map((g) => g.dernier || 0));
    html += `<div class="bloc verre apparait"><div class="titre"><span class="lbl">Sauvegardes</span><a href="/metriques#stockage">Détail →</a></div>
      <div class="ligne-kv"><span>Dernière</span><span>${dernier ? A.il_y_a(dernier) : "—"}</span></div><div class="ligne-kv"><span>Réussies sur 7 j</span><span>${p.reussies_7j}</span></div>
      <div class="ligne-kv"><span>Échecs sur 7 j</span><span>${p.echecs_7j}</span></div><div class="piste"><i style="width:${100 * p.utilise / (p.total || 1)}%"></i></div>
      <div class="ligne-kv"><span>Datastore</span><span>${A.octets(p.utilise)} sur ${A.octets(p.total)}</span></div></div>`;
  }
  $("cote").innerHTML = html;
}

function rendre() {
  const d = donnees;
  salut();
  const ko = d.kpis.services.total - d.kpis.services.ok;
  $("resume").textContent = ko ? `${ko} service${ko > 1 ? "s" : ""} en panne.` : d.n_alertes ? `Tout répond. ${d.n_alertes} point${d.n_alertes > 1 ? "s" : ""} à regarder.` : "Tout répond, rien à signaler.";
  $("etat-global").innerHTML = `<span class="dot ${ko ? "ko" : "ok"}"></span><span>${d.kpis.services.ok} / ${d.kpis.services.total} services en ligne</span>`;
  kpis(d); noeuds(d); groupes(d); cote(d);
  A.alertes(d.n_alertes);
  A.apparition(document);
}

async function charger() {
  try {
    const r = await fetch("/api/services", { cache: "no-store" });
    if (r.ok) { donnees = await r.json(); rendre(); }
  } catch (x) { $("resume").textContent = "Impossible de joindre le tableau de bord."; }
}
$("q").oninput = () => donnees && groupes(donnees);
$("q").onkeydown = (ev) => { if (ev.key === "Enter") { const t = document.querySelector(".tuile"); if (t) window.open(t.href, "_blank"); } if (ev.key === "Escape") { ev.target.value = ""; groupes(donnees); } };
document.addEventListener("keydown", (ev) => { if (ev.key === "/" && document.activeElement.tagName !== "INPUT") { ev.preventDefault(); $("q").focus(); } });
charger(); setInterval(charger, 60000);
</script>
</body>
</html>
